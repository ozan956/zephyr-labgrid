# ESP32 DevKitC behind a USB-UART bridge (CP2102). esptool on the exporter
# flashes over the same serial port that is used as console, so the console
# must not be open while flashing: use flash_before: true in the Twister
# hardware map and close labgrid-pty before a manual west flash.
#
# {device.devnode} is the tty on the exporter (USBFlashableDevice matched on
# SUBSYSTEM tty), {address} is the flash offset the runner reads from the
# build (the boot partition of the devicetree for Espressif SoCs), {image}
# the copied zephyr.bin. The FlashScriptDriver named reset is for west reset.
images:
  flash-script: esptool-flash.sh
targets:
  main:
    resources:
      RemotePlace:
        name: !template $LG_PLACE
    drivers:
      - SerialDriver: {}
      - FlashScriptDriver:
          script: flash-script
          args:
            - "{device.devnode}"
            - "{address}"
            - "{image}"
      - FlashScriptDriver:
          name: reset
          script: flash-script
          args: [reset, "{device.devnode}"]
