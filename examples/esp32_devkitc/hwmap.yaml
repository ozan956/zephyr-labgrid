# Twister hardware map for an ESP32-DevKitC behind labgrid.
# labgrid-twister-hwmap writes the same entry from the tags
# zephyr_platform, zephyr_env, zephyr_flash_before and zephyr_pty_args.
#
# flash_before: esptool uses the console UART, so the console is opened
# after flashing. --reset-rts then reboots the board into the open console.
- connected: true
  id: esp32-devkitc
  platform: esp32_devkitc/esp32/procpu
  product: labgrid
  runner: labgrid
  runner_params:
    - --dev-id=esp32-devkitc
    - --env=/path/to/zephyr-labgrid/examples/esp32_devkitc/labgrid-esp32.yaml
  serial_pty: "labgrid-pty,-p,esp32-devkitc,-e,/path/to/zephyr-labgrid/examples/esp32_devkitc/labgrid-esp32.yaml,--reset-rts"
  flash_timeout: 120
  flash_before: true
