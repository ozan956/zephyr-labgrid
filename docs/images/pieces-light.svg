<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     role="img" aria-label="the runner and labgrid-pty on the developer host reach the flash tool and ser2net on the exporter host, both hosts keep a session with the coordinator">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
              text-anchor: middle; }
      .t { font-size: 18px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 15px; fill: #59636e; }
      .l { font-size: 15px; fill: #59636e; }
      .p { font-size: 15px; font-weight: 600; fill: #59636e; text-anchor: start;
            letter-spacing: 0.04em; text-transform: uppercase; }
    </style>
  </defs>
  <rect x="20" y="20" width="330" height="430" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/>
  <text x="38" y="48" class="p">Developer or CI host</text>
  <rect x="530" y="20" width="330" height="430" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/>
  <text x="548" y="48" class="p">Exporter host</text>
  <rect x="45" y="70" width="280" height="60" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="185.0" y="105.0" class="t">twister --device-testing</text>
  <rect x="85" y="170" width="240" height="64" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="205.0" y="194.0" class="t">west flash, west reset</text>
  <text x="205.0" y="214.0" class="s">labgrid runner</text>
  <rect x="85" y="290" width="240" height="64" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="205.0" y="314.0" class="t">labgrid-pty</text>
  <text x="205.0" y="334.0" class="s">console bridge</text>
  <line x1="205" y1="130" x2="205" y2="168" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 62 130 V 322 H 83" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="552" y="170" width="196" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="650.0" y="194.0" class="t">flash tool</text>
  <text x="650.0" y="214.0" class="s">OpenOCD, esptool, JLink</text>
  <rect x="552" y="290" width="196" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="650.0" y="314.0" class="t">ser2net</text>
  <text x="650.0" y="334.0" class="s">RFC2217 serial</text>
  <rect x="552" y="385" width="196" height="44" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="650.0" y="412.0" class="t">labgrid-exporter</text>
  <rect x="770" y="170" width="72" height="184" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="806.0" y="267.0" class="t">board</text>
  <line x1="748" y1="202" x2="768" y2="202" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="770" y1="322" x2="750" y2="322" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="325" y1="202" x2="550" y2="202" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="438" y="194.0" class="l">flash over ssh</text>
  <line x1="325" y1="322" x2="550" y2="322" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="438" y="314.0" class="l">console over RFC2217</text>
  <rect x="372" y="380" width="136" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="440.0" y="400.0" class="t">coordinator</text>
  <text x="440.0" y="420.0" class="s">places and tags</text>
  <line x1="352" y1="408" x2="370" y2="408" stroke="#59636e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#m)"/>
  <line x1="528" y1="408" x2="510" y2="408" stroke="#59636e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#m)"/>
  <text x="440" y="368" class="l">labgrid sessions</text>
</svg>
